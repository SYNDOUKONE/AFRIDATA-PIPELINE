name: afridata

x-python-env: &python-env
  ENV: docker
  KAFKA_BOOTSTRAP_SERVERS: kafka:29092
  KAFKA_TOPIC_TRANSACTIONS: transactions.raw
  MINIO_ENDPOINT: minio:9000
  MINIO_ROOT_USER: ${MINIO_ROOT_USER:-afridata}
  MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-afridata_secret}
  DATALAKE_BUCKET: ${DATALAKE_BUCKET:-datalake}
  AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-afridata}
  AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-afridata_secret}
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: ${POSTGRES_DB:-warehouse}
  POSTGRES_USER: ${POSTGRES_USER:-afridata}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-afridata_secret}

x-spark-env: &spark-env
  AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-afridata}
  AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-afridata_secret}
  AWS_REGION: us-east-1
  S3_ENDPOINT: http://minio:9000
  S3A_PATH_STYLE: "true"
  DATALAKE_BUCKET: ${DATALAKE_BUCKET:-datalake}
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: ${POSTGRES_DB:-warehouse}
  POSTGRES_USER: ${POSTGRES_USER:-afridata}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-afridata_secret}

x-airflow-common: &airflow-common
  image: afridata-airflow:2.9.2
  build:
    context: .
    dockerfile: docker/Dockerfile.airflow
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-afridata}:${POSTGRES_PASSWORD:-afridata_secret}@postgres:5432/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    AIRFLOW_CONN_WAREHOUSE_POSTGRES: postgresql://${POSTGRES_USER:-afridata}:${POSTGRES_PASSWORD:-afridata_secret}@postgres:5432/${POSTGRES_DB:-warehouse}
    COMPOSE_PROJECT_NAME: afridata
    NB_TRANSACTIONS: ${NB_TRANSACTIONS:-1000000}
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - airflow_logs:/opt/airflow/logs
    - /var/run/docker.sock:/var/run/docker.sock
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    container_name: afridata-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-afridata}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-afridata_secret}
      POSTGRES_DB: ${POSTGRES_DB:-warehouse}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./warehouse/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-afridata} -d ${POSTGRES_DB:-warehouse}"]
      interval: 10s
      timeout: 5s
      retries: 5

  airflow-db-init:
    image: postgres:16
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-afridata_secret}
      PGUSER: ${POSTGRES_USER:-afridata}
    entrypoint: ""
    command: >
      sh -c "psql -h postgres -d postgres -tc \"SELECT 1 FROM pg_database WHERE datname='airflow'\" | grep -q 1 || psql -h postgres -d postgres -c 'CREATE DATABASE airflow'"

  minio:
    image: minio/minio:RELEASE.2024-08-17T01-24-54Z
    container_name: afridata-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-afridata}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-afridata_secret}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:RELEASE.2024-08-26T15-33-07Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-afridata}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-afridata_secret}
      DATALAKE_BUCKET: ${DATALAKE_BUCKET:-datalake}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/$$DATALAKE_BUCKET &&
      echo 'MinIO bucket prêt'"

  kafka:
    image: apache/kafka:3.7.1
    container_name: afridata-kafka
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"

  python-jobs:
    image: python:3.12-slim
    container_name: afridata-python-jobs
    working_dir: /opt/project
    command: sh -c "pip install --no-cache-dir -r requirements.txt && pip install --no-cache-dir boto3 minio && sleep infinity"
    environment:
      <<: *python-env
      PYTHONUNBUFFERED: "1"
    volumes:
      - .:/opt/project

  spark-jobs:
    image: apache/spark:3.5.1-scala2.12-java11-python3-ubuntu
    container_name: afridata-spark-jobs
    working_dir: /opt/project
    command: sleep infinity
    environment:
      <<: *spark-env
    volumes:
      - .:/opt/project
    ports:
      - "${SPARK_UI_PORT:-4040}:4040"

  airflow-init:
    <<: *airflow-common
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create --username ${AIRFLOW_USER:-afridata} --password ${AIRFLOW_PASSWORD:-afridata} --firstname Africa --lastname Data --role Admin --email admin@example.com || true

  airflow-scheduler:
    <<: *airflow-common
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: scheduler

  airflow-webserver:
    <<: *airflow-common
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    ports:
      - "${AIRFLOW_PORT:-8080}:8080"
    command: webserver

volumes:
  postgres_data:
  minio_data:
  airflow_logs:
